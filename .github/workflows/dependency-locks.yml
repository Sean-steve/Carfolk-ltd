name: Phase 6 — Generate Reviewed Dependency Locks
on:
  push:
    branches: [phase/6-production-readiness]
    paths:
      - ".github/workflows/dependency-locks.yml"
permissions:
  contents: write
jobs:
  lockfiles:
    if: github.repository == 'Sean-steve/Carfolk-ltd' && github.ref == 'refs/heads/phase/6-production-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring,pdo_pgsql,pgsql,gd,fileinfo,dom,xml,curl,bcmath,exif
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate Composer production lock
        run: composer update --no-interaction --no-scripts --no-progress --prefer-dist
        working-directory: apps/api
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: apps/web
      - name: Commit lockfiles to phase branch
        run: |
          test -s apps/api/composer.lock && test -s apps/web/package-lock.json
          git add apps/api/composer.lock apps/web/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: lock PHP and Node dependencies for Phase 6'
          git push origin HEAD:phase/6-production-readiness
